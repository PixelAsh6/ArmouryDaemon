[package]
name = "armoury"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ArmouryDaemon"
path = "src/main.rs"

[dependencies]
armoury-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
interprocess.workspace = true
tray-icon.workspace = true
windows = { workspace = true, features = ["Win32_System_WindowsProgramming", "Win32_Security_Authorization"] }
windows-sys.workspace = true
eframe.workspace = true
rhai.workspace = true
ureq.workspace = true
sha2.workspace = true
image.workspace = true
# The pipe's security descriptor is built from an SDDL string.
widestring = "1"
