[package]
name = "armoury"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ArmouryDaemon"
path = "src/main.rs"

[dependencies]
armoury-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
interprocess.workspace = true
tray-icon.workspace = true
# Win32_System_TaskScheduler: the scheduled task the daemon registers for itself.
# Win32_System_Ole: the VARIANT the task scheduler's API takes.
windows = { workspace = true, features = ["Win32_System_WindowsProgramming", "Win32_Security_Authorization", "Win32_System_TaskScheduler", "Win32_System_Ole"] }
windows-sys.workspace = true
eframe.workspace = true
rhai.workspace = true
ureq.workspace = true
sha2.workspace = true
minisign-verify.workspace = true
image.workspace = true
# The pipe's security descriptor is built from an SDDL string.
widestring = "1"
