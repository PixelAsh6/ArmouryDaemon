[workspace]
resolver = "3"
members = ["crates/armoury-core", "crates/armoury"]
# The voice helper is its own workspace: sherpa-onnx statically links a large prebuilt onnxruntime
# and must not slow down (or require network for) a normal daemon build.
#   cargo build --release --manifest-path voice/Cargo.toml
exclude = ["voice"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
armoury-core = { path = "crates/armoury-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = { version = "0.4.28", features = ["std"] }
crossbeam-channel = "0.5.17"
interprocess = "2.4.5"
tray-icon = "0.26.1"
global-hotkey = "0.9.0"
# Spec 3: packs may carry a script that the daemon interprets (sandboxed, whitelisted host API).
# Kept in `armoury` only, so the core and the GUI never link the interpreter.
rhai = { version = "1.26", default-features = false, features = ["std"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Graphics_Gdi", "Win32_System_Registry"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_Graphics_Gdi"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
