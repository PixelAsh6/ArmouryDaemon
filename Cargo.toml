[workspace]
resolver = "3"
members = ["crates/armoury-core", "crates/armoury"]

[workspace.package]
version = "1.1.6"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
armoury-core = { path = "crates/armoury-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = { version = "0.4.28", features = ["std"] }
crossbeam-channel = "0.5.17"
interprocess = "2.4.5"
tray-icon = "0.26.1"
# Spec 2: packs may carry a script that the daemon interprets (sandboxed, whitelisted host API).
# Kept in `armoury` only, so the core and the GUI never link the interpreter.
rhai = { version = "1.26", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Input_XboxController", "Win32_UI_Controls", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_System_Console"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }
# Phase 8: the pack catalog is fetched over HTTPS and its files are verified before install.
# The root store is the Windows certificate store (`platform-verifier`), not Mozilla's bundled
# roots: a machine with a corporate CA or a TLS-intercepting proxy has to be able to fetch the
# catalogue and the cover art. `win-system-proxy` reads the user's WinINet proxy settings (this
# is a per-user desktop app, not a Windows service), and `gzip` compresses the manifest and the
# pack files.
#
# The rustls features are spelled out instead of using `rustls`: `rustls` is
# `rustls-no-provider` + `_ring` + `rustls-webpki-roots`, and the last one is Mozilla's bundled
# root certificates - 146 kB of certificates the build has no use for, because the Windows
# store is the only root store it can validate against. Without the feature the client refuses
# the bundled roots instead of using them (`RootCerts::WebPki` panics), so a fetch that went
# anywhere but the shared client could not be validated at all.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "win-system-proxy", "gzip"] }
sha2 = "0.10"
# B2: the catalogue manifest travels minisign-signed; the keyring is baked in and the
# signature is verified before the manifest is parsed. Verify-only - signing stays with
# the keeper's private key, which never enters a repository.
minisign-verify = "0.3.0"
# B3: a `helper` module is a downloaded archive the daemon extracts into `modules/<id>/`.
# Pure-Rust deflate/deflate-decoder, no C toolchain in the build.
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
incremental = false
