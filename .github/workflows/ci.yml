# Continuous integration for ArmouryDaemon.
#
# The project is Windows-only: the daemon talks to the Win32 API, the icon and the manifest
# are embedded by Microsoft's resource compiler (rc.exe), and the self-test harness drives a
# real daemon over a named pipe. This workflow builds and tests. It never publishes a
# release: no release, no tag - a release workflow is a separate decision. The one thing
# it can leave behind is the release build as an artefact on a manual run, so there is a
# binary to test before a release is ever published.
#
# The release profile (lto = "fat", codegen-units = 1) needs 13 to 21 minutes, so it is only
# built on a tag push or on a manual run. Every other push is covered by the debug build and
# the test run.

name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to a branch makes the running build of that branch obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The release profile has incremental = false; the cache must not carry incremental
  # artefacts of one profile into the build of another.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        # The toolchain is pinned to 1.98.0 and not to "stable": stable moves to a new
        # release every six weeks, so two runs of the same commit can be built by
        # different compilers. This workflow hands over the release build as an artefact to
        # test and the release workflow publishes that same source later, so the binary
        # that was tested has to be the binary that ships: only a pinned toolchain says so.
        # The workspace asks for rust-version = "1.95" (the minimum supported version);
        # the pin is above it and does not change it. There is no rust-toolchain.toml.
        # The host target is x86_64-pc-windows-msvc, the one the Windows runners are set up
        # for; the MSVC toolchain and the Windows SDK (rc.exe) come with the runner image,
        # so the action asks for no components.
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Find the Windows resource compiler (rc.exe)
        shell: pwsh
        run: |
          # crates/armoury/build.rs embeds the icon and the manifest as PE resources with
          # rc.exe. It searches ProgramFiles(x86)\Windows Kits\10\bin itself and honours the
          # RC variable, so the same search is done here and the result is handed to the
          # build: the newest SDK that ships an x64\rc.exe wins, exactly like the build does.
          $base = ${env:ProgramFiles(x86)}
          $bin = if ($base) { Join-Path $base 'Windows Kits\10\bin' } else { $null }
          $rc = $null
          $newest = $null
          if ($bin -and (Test-Path -LiteralPath $bin)) {
              foreach ($dir in Get-ChildItem -LiteralPath $bin -Directory) {
                  $candidate = Join-Path $dir.FullName 'x64\rc.exe'
                  if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
                  try { $version = [version]$dir.Name } catch { continue }
                  if ($null -eq $newest -or $version -gt $newest) {
                      $newest = $version
                      $rc = $candidate
                  }
              }
          }
          if ($rc) {
              Write-Host "rc.exe: $rc"
              "RC=$rc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
              Write-Host "warning: no rc.exe under $bin - the icon and the manifest are not embedded"
          }

      - name: Cache the cargo registry and the target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-

      - name: Build the workspace (debug)
        shell: pwsh
        run: |
          # The error action preference is reset: cargo writes its progress to stderr, and a
          # shell that stops on every error record would call that a failure. The exit code
          # of cargo decides, not the stream it wrote to.
          $ErrorActionPreference = 'Continue'
          cargo build --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed (exit code $LASTEXITCODE)" }

      - name: Check that the executable carries its manifest
        shell: pwsh
        run: |
          # The manifest is what makes Windows ask for administrator rights. It is embedded
          # from assets/ArmouryDaemon.manifest by rc.exe, so a missing one means the resource
          # compiler was not found and the executable would not be auto-elevated.
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target\debug\ArmouryDaemon.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "the debug executable is missing: $exe" }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if (-not $text.Contains('requireAdministrator')) {
              throw 'the executable does not carry the manifest: rc.exe was not found, so the build has neither the icon nor the auto-elevation'
          }
          Write-Host 'the manifest is embedded (the executable asks Windows for administrator rights)'

      - name: Run the unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed (exit code $LASTEXITCODE)" }

      - name: Check that the shell is elevated
        shell: pwsh
        run: |
          # The harness skips the command-line probes when the shell that runs it is not
          # elevated, because the executable asks Windows for administrator rights and every
          # probe would raise a UAC prompt. The Windows runners run with the administrative
          # token, so this holds - and a runner that does not satisfy it fails here instead
          # of quietly running fewer checks.
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'the self-test harness needs an elevated shell'
          }
          Write-Host "elevated as $($identity.Name)"

      - name: Run the self-test harness
        working-directory: tools
        shell: pwsh
        run: |
          # The harness resolves -Exe against the current directory, so it runs from the
          # tools folder and points at the debug build the test step has just made.
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'daemon-selftest.log'
          & powershell -ExecutionPolicy Bypass -File .\daemon-selftest.ps1 -Exe ..\target\debug\ArmouryDaemon.exe 2>&1 |
              Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $summary = @('## Self-test harness', '')
          if ($code -eq 0) {
              $summary += 'Result: every check passed.'
          } else {
              $summary += "Result: failed (exit code $code)."
          }
          $summary += ''
          $summary += '```'
          $summary += @(Get-Content -LiteralPath $log | Select-Object -Last 30)
          $summary += '```'
          $summary -join [Environment]::NewLine | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { throw "the self-test harness failed (exit code $code)" }

      - name: Build the release profile
        # The release profile needs 13 to 21 minutes, so it is only built on a tag push or
        # on a manual run. Nothing is published here: no release, no tag. The build only
        # leaves an artefact behind, so the binary can be tested before a release exists.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo build --workspace --release --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build --release failed (exit code $LASTEXITCODE)" }

      - name: Write the hash sidecar
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The sidecar is the format deploy/setup.ps1 writes: the lowercase hex digest, two
          # spaces, the file name and a trailing CRLF - 85 bytes. The bytes are written here
          # and not through Set-Content, so the 85 bytes are exactly the 85 bytes of the
          # format whatever the shell does with a line ending. This is the step the release
          # workflow runs, so the artefact carries the very sidecar the release carries.
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target\release\ArmouryDaemon.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "the release executable is missing: $exe" }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
              $stream = [System.IO.File]::OpenRead($exe)
              try { $bytes = $sha.ComputeHash($stream) } finally { $stream.Dispose() }
          } finally { $sha.Dispose() }
          $hash = ([System.BitConverter]::ToString($bytes) -replace '-', '').ToLowerInvariant()
          [System.IO.File]::WriteAllBytes("$exe.sha256", [System.Text.Encoding]::ASCII.GetBytes("$hash  ArmouryDaemon.exe`r`n"))
          $written = [System.IO.File]::ReadAllBytes("$exe.sha256")
          if ($written.Length -ne 85) { throw "the sidecar is $($written.Length) bytes, not the 85 the format asks for" }
          Write-Host "the exe hash is $hash"

      - name: Upload the executable for testing
        # The artefact holds the two files the release holds: the executable and its
        # sidecar. A run of this workflow is a test of the build, not a release.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: armourydaemon-windows-x64
          path: |
            target/release/ArmouryDaemon.exe
            target/release/ArmouryDaemon.exe.sha256
            target/release/ArmouryConsole.exe
          if-no-files-found: error
